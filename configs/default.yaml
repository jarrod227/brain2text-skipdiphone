# Model
encoder:
  input_dim: 256                 # raw neural feature dimension
  hidden_dim: 1024               # matches cffan/neural_seq_decoder
  num_layers: 5
  dropout: 0.4
  kernel_len: 32                 # sliding-window size (unfold)
  stride_len: 4                  # sliding-window stride
  gaussian_smooth_width: 2.0     # sigma for input Gaussian smoothing

# Classes
num_phonemes: 40          # CMU phoneme set size
num_diphones: 1600        # 40 * 40
num_days: 24              # 24 recording sessions (April–August 2022)

# Loss weights  (Eq. 1 in proposal)
alpha: 0.6                # weight for standard diphone CTC loss
beta: 0.1                 # weight for skip-diphone auxiliary CTC loss (small by design)
lambda_smooth: 1.0e-3     # temporal smoothness weight; sweep: [0, 1e-4, 1e-3, 5e-3, 1e-2]

# Training
variant: "E"              # ablation variant: A | B | C | D | E
batch_size: 64
num_epochs_by_variant:
  A: 120
  B: 200
  C: 200
  D: 200
  E: 200
learning_rate: 0.02
lr_schedule: linear
grad_clip: 1.0
seed: 42
adam_eps: 0.1             # matches cffan; large eps stabilizes Adam at lr=0.02
weight_decay: 1.0e-5      # L2 regularization, matches cffan
white_noise_sd: 0.8       # data augmentation: per-frame white noise (matches cffan)
constant_offset_sd: 0.2   # data augmentation: per-trial constant offset (matches cffan)

# Data
data_path: "data/competitionData.pkl"  # output of formatCompetitionData.ipynb
lm_dir: "data/languageModel"
debug_subset: false        # set true to use first 200 trials for fast debugging

# Logging
log_dir: "experiments"
save_every: 5             # checkpoint every N epochs
